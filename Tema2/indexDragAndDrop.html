<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag And Drop</title>
    <style>
        .cajaRoja{
            width: 100px;
            height: 100px;
            background-color: red;
            cursor: grab;
        }
        .cajaAzul{
            width: 100px;
            height: 100px;
            background-color: rgb(0,0,255);
            cursor: grab;
        }
        .contenedor{
            width: 200px;
            min-height: 200px;
            border: 2px solid rgb(0, 0, 0);
            border-radius: 20px;
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="cajaRoja" draggable="true"></div>
    <div class="cajaAzul" draggable="true"></div>
    <div class="contenedor"></div>
    
    <script src="./10.dragAndDrop.js"></script>
</body>
</html>
